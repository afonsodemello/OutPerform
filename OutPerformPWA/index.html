<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>OutPerform</title>
  <meta name="description" content="Recovery, strain, sleep, readiness and focus — computed on your device." />
  <meta name="theme-color" content="#07070b" />
  <link rel="manifest" href="manifest.webmanifest" />

  <!-- iOS add-to-home-screen support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OutPerform" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <header class="app">
    <div class="brand"><img src="icons/icon-192.png" alt="" /> OutPerform</div>
    <div class="hright">
      <div class="sync" id="sync"><span class="dot"></span> <span id="syncText">Loading…</span></div>
      <a class="support-btn" href="https://revolut.me/afonsodemello" target="_blank" rel="noopener">♥ Support</a>
    </div>
  </header>

  <main id="view"><!-- rendered by app.js --></main>
  <div id="modal" class="modal hidden"></div>

  <nav class="tabs" id="tabs">
    <button data-tab="today" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      Today
    </button>
    <button data-tab="focus">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="0.8" fill="currentColor"/></svg>
      Focus
    </button>
    <button data-tab="sleep">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
      Sleep
    </button>
    <button data-tab="strain">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c3 4 5 6 5 9.5A5 5 0 0 1 7 11.5c0-1.6.6-2.8 1.6-4 .2 1.4 1 2.4 2.1 2.9C12 8.5 10.7 5.4 12 2z"/></svg>
      Strain
    </button>
    <button data-tab="more">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
      More
    </button>
  </nav>

  <script src="algorithms.js"></script>
  <script src="google-health.js"></script>
  <script src="app.js"></script>
</body>
</html>
